<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard - FieldForce</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>
  <div class="app-container">
    <!-- Offline status banner -->
    <div class="sync-banner" id="sync-banner"></div>

    <!-- Header area -->
    <header class="app-header">
      <h1>FieldForce</h1>
      <!-- <span class="badge badge-worker worker-role-placeholder">Worker</span> -->
    </header>

    <!-- Dashboard Greeting -->
    <section class="dashboard-greeting">
      <div class="greeting-info">
        <h2 id="greeting-text">Hello,</h2>
        <h2 class="worker-name-placeholder" style="color: var(--primary-dark);">Worker</h2>
        <p id="current-date-text">Friday, May 22, 2026</p>
        <div id="worker-location"
          style="display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-light); margin-top: 4px; font-weight: 500;">
          <svg viewBox="0 0 24 24" fill="currentColor" style="width: 12px; height: 12px; color: var(--primary);">
            <path fill-rule="evenodd"
              d="M11.54 22.351l.07.04.028.016a.76.76 0 00.723 0l.028-.015.071-.041a16.975 16.975 0 001.144-.742 19.58 19.58 0 002.683-2.282c1.944-1.99 3.963-4.98 3.963-8.827a7.25 7.25 0 00-14.5 0c0 3.846 2.02 6.837 3.963 8.827a19.58 19.58 0 002.682 2.282 16.975 16.975 0 001.145.742zM12 13.5a3 3 0 100-6 3 3 0 000 6z"
              clip-rule="evenodd" />
          </svg>
          <span id="worker-city-text">Detecting location...</span>
        </div>
      </div>
      <div class="profile-avatar-container">
        <!-- Render a default SVG avatar -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </div>
    </section>

    <!-- Statistics Grid -->
    <section class="stats-section">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-total">-</div>
          <div class="stat-label">Total<br>Added</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-today">-</div>
          <div class="stat-label">Added<br>Today</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-week">-</div>
          <div class="stat-label">Added<br>This Week</div>
        </div>
      </div>
    </section>

    <!-- Section Title -->
    <section class="section-header">
      <h3>Recent Additions</h3>
      <a href="/restaurants" class="see-all">See All</a>
    </section>

    <!-- Recent Additions List -->
    <section class="restaurant-list" id="recent-list">
      <!-- Skeletons loading state -->
      <div class="card"
        style="height: 90px; background-color: white; opacity: 0.6; display: flex; align-items: center; justify-content: center; border-radius: 16px;">
        <span class="text-sm text-light">Loading additions...</span>
      </div>
    </section>

    <!-- Floating Translucent Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="/" class="bottom-nav-item active" id="nav-home">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
        <span>Home</span>
      </a>
      <a href="/restaurants" class="bottom-nav-item" id="nav-restaurants">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
        </svg>
        <span>MSL List</span>
      </a>
      <a href="/add-restaurant" class="bottom-nav-item add-button-item">
        <div class="bottom-nav-add-btn">
          <svg viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
        </div>
      </a>
      <a href="/profile" class="bottom-nav-item" id="nav-profile">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
        </svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/location.js"></script>
  <script src="/js/db-offline.js"></script>

  <script>
    window.copyMSL = function(event, code, btn) {
      if (event) event.preventDefault();
      navigator.clipboard.writeText(code).then(() => {
        const originalHTML = btn.innerHTML;
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" style="width: 12px; height: 12px;"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;
        setTimeout(() => {
          btn.innerHTML = originalHTML;
        }, 2000);
      });
    };

    document.addEventListener('DOMContentLoaded', () => {
      // Set greeting message based on local time
      const greetingText = document.getElementById('greeting-text');
      const now = new Date();
      const hour = now.getHours();

      let greeting = 'Hello,';
      if (hour < 12) greeting = 'Good morning,';
      else if (hour < 17) greeting = 'Good afternoon,';
      else greeting = 'Good evening,';

      if (greetingText) greetingText.textContent = greeting;

      // Set date
      const dateText = document.getElementById('current-date-text');
      if (dateText) {
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        dateText.textContent = now.toLocaleDateString('en-US', options);
      }

      // Fetch dashboard metrics
      loadDashboardStats();

      // Listen for sync completions to update dashboard stats automatically
      window.addEventListener('sync-completed', () => {
        loadDashboardStats();
      });

      // Detect worker's current city
      detectCurrentCity();
    });

    async function detectCurrentCity() {
      const cityTextEl = document.getElementById('worker-city-text');
      if (!cityTextEl) return;

      // Immediately display cached value if available
      const cached = localStorage.getItem('last_worker_city');
      if (cached) {
        cityTextEl.textContent = cached;
      }

      try {
        const coords = await locationService.getCurrentCoords();
        const info = await locationService.reverseGeocode(coords.latitude, coords.longitude);

        let locationStr = '';
        if (info.area && info.city) {
          locationStr = `${info.area}, ${info.city}`;
        } else {
          locationStr = info.city || info.state || 'Unknown Location';
        }

        cityTextEl.textContent = locationStr;
        localStorage.setItem('last_worker_city', locationStr);
      } catch (err) {
        console.warn('Could not detect current location:', err);
        if (!cached) {
          cityTextEl.textContent = 'Location Unavailable';
        } else {
          cityTextEl.textContent = `${cached} (Offline)`;
        }
      }
    }

    async function loadDashboardStats() {
      const totalEl = document.getElementById('stat-total');
      const todayEl = document.getElementById('stat-today');
      const weekEl = document.getElementById('stat-week');
      const recentListEl = document.getElementById('recent-list');

      try {
        const stats = await api.get('/restaurants/stats/worker');
        if (!stats) return;
        window.allLoadedRestaurants = stats.recentAdditions;

        // Animate counts
        animateCount(totalEl, stats.totalAdded);
        animateCount(todayEl, stats.addedToday);
        animateCount(weekEl, stats.addedThisWeek);

        // Render recent additions
        if (stats.recentAdditions && stats.recentAdditions.length > 0) {
          recentListEl.innerHTML = stats.recentAdditions.map(item => {
            // Display date formatted nicely
            const date = new Date(item.createdAtUTC || item.createdAtIST);
            const dateStr = date.toLocaleDateString([], { month: 'short', day: 'numeric' });
            const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            return `
              <a href="/restaurant-detail?id=${item._id}" class="restaurant-item" style="flex-direction: column; align-items: stretch; padding: 16px; gap: 12px; border-radius: 16px;">
                <!-- Top Row: Image + Name/Code -->
                <div style="display: flex; align-items: center; gap: 12px;">
                  <img src="${item.image || '/assets/images/default-restaurant.svg'}" alt="${item.mslname}" class="restaurant-item-img" onerror="this.src='/assets/images/default-restaurant.svg'" style="width: 48px; height: 48px; border-radius: 10px; flex-shrink: 0; object-fit: cover;">
                  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden;">
                    <div style="font-size: 15px; font-weight: 700; color: var(--text-main); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${item.mslname}</div>
                    <div style="display: flex; align-items: center; gap: 6px; margin-top: 4px;">
                      <div style="font-family: monospace; color: var(--primary-dark); font-size: 12px; font-weight: 700;" class="copyable-text" title="Select to copy">[${item.mslCode || 'N/A'}]</div>
                      ${item.mslCode ? `<button onclick="window.copyMSL(event, '${item.mslCode}', this)" style="background: none; border: none; cursor: pointer; color: var(--text-light); display: flex; align-items: center; padding: 2px;" title="Copy Code">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                          <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
                        </svg>
                      </button>` : ''}
                    </div>
                  </div>
                </div>
                
                <!-- Divider -->
                <div style="height: 1px; background-color: var(--border-color); width: 100%;"></div>
                
                <!-- Details Grid -->
                <div style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
                  <!-- Row 1: Action Button & DateTime -->
                  <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <span onclick="event.stopPropagation(); event.preventDefault(); window.launchLivePreview('${item._id}')" class="btn btn-primary" style="padding: 4px 10px; font-size: 10px; height: auto; width: auto; border-radius: 6px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; border: none; text-transform: uppercase; color: white; background-color: var(--primary);">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width: 12px; height: 12px; stroke: currentColor;">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25(2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25m18 0A2.25 2.25 0 0018.75 3H5.25A2.25 2.25 0 003 5.25m18 0V12a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 12V5.25" />
                        <!-- Wait, let's use the clean SVG path from restaurants.html to be identical: -->
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25m18 0A2.25 2.25 0 0018.75 3H5.25A2.25 2.25 0 003 5.25m18 0V12a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 12V5.25" />
                      </svg>
                      Live Preview
                    </span>
                    <span style="font-size: 11px; color: var(--text-light); font-weight: 600;">${dateStr}, ${timeStr}</span>
                  </div>
                  
                  <!-- Row 2: City & Phone -->
                  <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <span style="font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%;">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:14px; height:14px; flex-shrink: 0;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25s-7.5-4.108-7.5-11.25z" /></svg>
                      ${item.city || 'Unknown'}
                    </span>
                    <span style="font-size: 12px; color: var(--text-main); font-weight: 600; font-family: monospace; display: flex; align-items: center; gap: 4px;">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:12px; height:12px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.864-1.068l-3.264-.653a2.25 2.25 0 00-2.316.924l-1.06 1.325c-2.836-1.44-5.17-3.774-6.61-6.61l1.325-1.06a2.25 2.25 0 00.924-2.316l-.653-3.264C10.716 2.601 10.266 2.25 9.75 2.25h-1.372c-1.284 0-2.25 1.011-2.25 2.25z" /></svg>
                      ${item.phoneNumber && item.phoneNumber !== 'N/A' ? item.phoneNumber : '<span style="color:var(--error);">N/A</span>'}
                    </span>
                  </div>
                </div>
              </a>
            `;
          }).join('');
        } else {
          recentListEl.innerHTML = `
            <div class="card" style="text-align: center; padding: 30px 10px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-light)" stroke-width="1.5" style="width: 44px; height: 44px; margin: 0 auto 10px auto; display: block;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <p class="text-sm font-semibold" style="color: var(--text-muted);">No entries added yet.</p>
              <p class="text-xs text-light" style="margin-top: 4px;">Tap the '+' button below to add your first MSL entry!</p>
            </div>
          `;
        }
      } catch (err) {
        console.error('Dashboard Stats Load Error:', err);
        totalEl.textContent = '0';
        todayEl.textContent = '0';
        weekEl.textContent = '0';
        recentListEl.innerHTML = `
          <div class="card" style="text-align: center; padding: 20px; color: var(--error);">
            <p class="text-sm font-semibold">Failed to load statistics.</p>
          </div>
        `;
      }
    }

    function animateCount(element, target) {
      let current = 0;
      const duration = 800; // ms
      const stepTime = Math.abs(Math.floor(duration / target)) || 30;

      if (target === 0) {
        element.textContent = '0';
        return;
      }

      const timer = setInterval(() => {
        current += 1;
        element.textContent = current;
        if (current >= target) {
          element.textContent = target;
          clearInterval(timer);
        }
      }, stepTime);
    }

    // Live Demo Preview Actions
    window.openLiveDemoViewer = function(item) {
      if (!item) return;

      const modal = document.getElementById('live-demo-viewer-modal');
      const titleEl = document.getElementById('demo-viewer-title');
      const frameEl = document.getElementById('demo-frame');

      if (!modal || !frameEl || !titleEl) return;

      // Track demo shown
      if (item._id) {
        api.post(`/restaurants/${item._id}/mark-shown`, { type: 'demo' })
          .catch(err => console.error('Tracking demo shown failed:', err));
      }

      titleEl.textContent = `${item.mslname} - Live Demo`;
      
      // Save global getter for the iframe
      window.currentRestaurantData = item;
      window.getSelectedRestaurant = () => window.currentRestaurantData;

      const type = (item.businessType || 'Other').toLowerCase();
      let templateName = 'other';
      if (['restaurant', 'cafe', 'hospital', 'clinic', 'salon', 'gym', 'bakery', 'hotel'].includes(type)) {
        templateName = type;
      } else if (type === 'retail shop') {
        templateName = 'retail';
      }

      document.body.style.overflow = 'hidden';
      frameEl.src = `/templates/${templateName}/index.html`;
      modal.style.display = 'flex';
    };

    window.closeLiveDemoViewer = function() {
      const modal = document.getElementById('live-demo-viewer-modal');
      const frameEl = document.getElementById('demo-frame');
      if (modal) {
        modal.style.display = 'none';
        if (frameEl) frameEl.src = '';
        document.body.style.overflow = '';
      }
    };

    window.shareLiveDemo = function() {
      const item = window.currentRestaurantData;
      if (!item) return;

      const type = (item.businessType || 'Other').toLowerCase();
      let templateName = 'other';
      if (['restaurant', 'cafe', 'hospital', 'clinic', 'salon', 'gym', 'bakery', 'hotel'].includes(type)) {
        templateName = type;
      } else if (type === 'retail shop') {
        templateName = 'retail';
      }

      const previewUrl = `${window.location.origin}/templates/${templateName}/index.html?demoId=${item._id}`;
      
      if (navigator.share) {
        navigator.share({
          title: `Live Preview for ${item.mslname}`,
          text: `Check out this dynamic preview website generated for ${item.mslname}!`,
          url: previewUrl
        }).catch(err => console.log('Share error:', err));
      } else {
        navigator.clipboard.writeText(previewUrl).then(() => {
          alert('Live demo link copied to clipboard! Share it with the owner.');
        });
      }
    };

    window.launchLivePreview = function(id) {
      if (!window.allLoadedRestaurants) return;
      const item = window.allLoadedRestaurants.find(r => r._id === id);
      if (item) {
        window.openLiveDemoViewer(item);
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      const closeDemoBtn = document.getElementById('close-demo-viewer-btn');
      if (closeDemoBtn) {
        closeDemoBtn.addEventListener('click', closeLiveDemoViewer);
      }
      const shareDemoBtn = document.getElementById('share-demo-btn');
      if (shareDemoBtn) {
        shareDemoBtn.addEventListener('click', shareLiveDemo);
      }
      const demoModal = document.getElementById('live-demo-viewer-modal');
      if (demoModal) {
        demoModal.addEventListener('click', (e) => {
          if (e.target === demoModal) closeLiveDemoViewer();
        });
      }
    });
  </script>
  <!-- Fullscreen Live Demo Viewer Overlay -->
  <div class="live-demo-viewer-modal" id="live-demo-viewer-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; flex-direction: column; background-color: #0F172A;">
    <div class="viewer-header" style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background-color: #1E293B; border-bottom: 1px solid #334155; color: white;">
      <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
        <button class="viewer-close-btn" id="close-demo-viewer-btn" title="Close Preview" style="background: none; border: none; color: #94A3B8; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width: 20px; height: 20px;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
          </svg>
        </button>
        <h3 id="demo-viewer-title" style="font-size: 14px; font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;">Demo Website</h3>
      </div>
      <button id="share-demo-btn" class="btn btn-secondary" style="padding: 6px 12px; font-size: 11px; font-weight: 600; background: #334155; color: white; border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 6px; width: auto; height: auto;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width: 14px; height: 14px;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186l5.57 3.285m-5.57-3.285a2.25 2.25 0 115.57-3.285m0 3.285a2.25 2.25 0 110 2.186m0 0l-5.57-3.285" />
        </svg>
        <span>Share</span>
      </button>
    </div>
    <div class="viewer-body" id="demo-viewer-body" style="flex: 1; position: relative; overflow: hidden; background-color: #F8FAFC;">
      <iframe id="demo-frame" src="" style="width: 100%; height: 100%; border: none; display: block;"></iframe>
    </div>
  </div>
</body>

</html>
