<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MSL Directory - FieldForce</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>
  <div class="app-container">
    <!-- Offline status banner -->
    <div class="sync-banner" id="sync-banner"></div>

    <!-- Header -->
    <header class="app-header">
      <h1>MSL Directory</h1>
      <button class="btn btn-primary" onclick="window.location.href='/add-restaurant'" style="padding: 6px 14px; font-size: 13px; height: auto; width: auto; border-radius: 8px; gap: 6px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width: 14px; height: 14px;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Add
      </button>
    </header>

    <!-- Search Section -->
    <section class="search-container">
      <div class="search-input-wrapper">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
        </svg>
        <input type="text" id="search-bar" class="form-control search-input"
          placeholder="Search by MSL code, name, address, pin...">
      </div>
    </section>

    <!-- Filter Chips -->
    <section class="filters-container" id="chips-container">
      <div class="filter-chip active" data-filter="all">All</div>
      <div class="filter-chip" data-filter="today">Today</div>
      <div class="filter-chip" data-filter="last-2-days">Last 2 Days</div>
      <div class="filter-chip" data-filter="last-7-days">Last 7 Days</div>
    </section>

    <!-- Listings -->
    <section class="restaurant-list" id="listings-list">
      <!-- Loading Skeleton -->
      <div class="card"
        style="height: 100px; background-color: white; opacity: 0.6; display: flex; align-items: center; justify-content: center; border-radius: 16px; margin-bottom: 12px;">
        <span class="text-sm text-light">Loading MSL entries...</span>
      </div>
    </section>

    <!-- Floating Translucent Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="/" class="bottom-nav-item" id="nav-home">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
        <span>Home</span>
      </a>
      <a href="/restaurants" class="bottom-nav-item active" id="nav-restaurants">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
        </svg>
        <span>MSL List</span>
      </a>
      <a href="/add-restaurant" class="bottom-nav-item add-button-item">
        <div class="bottom-nav-add-btn">
          <svg viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
        </div>
      </a>
      <a href="/profile" class="bottom-nav-item" id="nav-profile">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
        </svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/db-offline.js"></script>

  <script>
    let activeFilter = 'all';
    let searchQuery = '';
    let debounceTimer;

    window.copyMSL = function(event, code, btn) {
      if (event) event.preventDefault();
      navigator.clipboard.writeText(code).then(() => {
        const originalHTML = btn.innerHTML;
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" style="width: 14px; height: 14px;"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;
        setTimeout(() => {
          btn.innerHTML = originalHTML;
        }, 2000);
      });
    };

    document.addEventListener('DOMContentLoaded', () => {
      loadRestaurants();

      // Bind search bar inputs with debounce
      const searchBar = document.getElementById('search-bar');
      searchBar.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          loadRestaurants();
        }, 350);
      });

      // Bind filter chip elements
      const chips = document.querySelectorAll('.filter-chip');
      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          chips.forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          activeFilter = chip.getAttribute('data-filter');
          loadRestaurants();
        });
      });

      window.addEventListener('sync-completed', () => {
        loadRestaurants();
      });
    });

    async function loadRestaurants() {
      const container = document.getElementById('listings-list');

      try {
        let endpoint = `/restaurants?filter=${activeFilter}`;
        if (searchQuery) {
          endpoint += `&search=${encodeURIComponent(searchQuery)}`;
        }

        // Check if viewing worker's own profile list or global
        const params = new URLSearchParams(window.location.search);
        if (params.get('my') === 'true') {
          endpoint += `&addedByMe=true`;
        }

        const data = await api.get(endpoint);
        if (!data) return;

        if (data.length > 0) {
          container.innerHTML = data.map(item => {
            const date = new Date(item.createdAtUTC || item.createdAtIST);
            const dateStr = date.toLocaleDateString([], { month: 'short', day: 'numeric' });
            const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            return `
              <a href="/restaurant-detail?id=${item._id}" class="restaurant-item" style="flex-direction: column; align-items: stretch; padding: 16px; gap: 12px; border-radius: 16px;">
                <!-- Top Row: Image + Name/Code -->
                <div style="display: flex; align-items: center; gap: 12px;">
                  <img src="${item.image || '/assets/images/default-restaurant.svg'}" alt="${item.mslname}" class="restaurant-item-img" onerror="this.src='/assets/images/default-restaurant.svg'" style="width: 48px; height: 48px; border-radius: 10px; flex-shrink: 0; object-fit: cover;">
                  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden;">
                    <div style="font-size: 15px; font-weight: 700; color: var(--text-main); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${item.mslname}</div>
                    <div style="display: flex; align-items: center; gap: 6px; margin-top: 4px;">
                      <div style="font-family: monospace; color: var(--primary-dark); font-size: 12px; font-weight: 700;" class="copyable-text" title="Select to copy">[${item.mslCode || 'N/A'}]</div>
                      ${item.mslCode ? `<button onclick="window.copyMSL(event, '${item.mslCode}', this)" style="background: none; border: none; cursor: pointer; color: var(--text-light); display: flex; align-items: center; padding: 2px;" title="Copy Code">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                          <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
                        </svg>
                      </button>` : ''}
                    </div>
                  </div>
                </div>
                
                <!-- Divider -->
                <div style="height: 1px; background-color: var(--border-color); width: 100%;"></div>
                
                <!-- Details Grid -->
                <div style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
                  <!-- Row 1: Added By & DateTime -->
                  <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--primary-dark); background-color: var(--primary-light); padding: 4px 8px; border-radius: 6px;">by ${item.addedBy ? item.addedBy.username : 'Unknown'}</span>
                    <span style="font-size: 11px; color: var(--text-light); font-weight: 600;">${dateStr}, ${timeStr}</span>
                  </div>
                  
                  <!-- Row 2: City & Phone -->
                  <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <span style="font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%;">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:14px; height:14px; flex-shrink: 0;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25s-7.5-4.108-7.5-11.25z" /></svg>
                      ${item.city || 'Unknown'}
                    </span>
                    <span style="font-size: 12px; color: var(--text-main); font-weight: 600; font-family: monospace; display: flex; align-items: center; gap: 4px;">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:12px; height:12px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.864-1.068l-3.264-.653a2.25 2.25 0 00-2.316.924l-1.06 1.325c-2.836-1.44-5.17-3.774-6.61-6.61l1.325-1.06a2.25 2.25 0 00.924-2.316l-.653-3.264C10.716 2.601 10.266 2.25 9.75 2.25h-1.372c-1.284 0-2.25 1.011-2.25 2.25z" /></svg>
                      ${item.phoneNumber && item.phoneNumber !== 'N/A' ? item.phoneNumber : '<span style="color:var(--error);">N/A</span>'}
                    </span>
                  </div>
                </div>
              </a>
            `;
          }).join('');
        } else {
          container.innerHTML = `
            <div class="card" style="text-align: center; padding: 40px 20px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-light)" stroke-width="1.5" style="width: 48px; height: 48px; margin: 0 auto 12px auto; display: block;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
              </svg>
              <p class="text-sm font-semibold" style="color: var(--text-muted);">No MSL entries found</p>
              <p class="text-xs text-light" style="margin-top: 4px;">Try modifying your search or filter settings.</p>
            </div>
          `;
        }
      } catch (err) {
        console.error('Fetch MSL Load Error:', err);
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 20px; color: var(--error);">
            <p class="text-sm font-semibold">Error retrieving MSL directory. Check network connection.</p>
          </div>
        `;
      }
    }
  </script>
</body>

</html>
