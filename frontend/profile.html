<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Profile - FieldForce</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    .profile-hero {
      text-align: center;
      padding: 30px 20px 20px 20px;
      background-color: white;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .profile-hero-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px auto;
      border: 3px solid white;
      box-shadow: var(--shadow-md);
    }

    .profile-hero-avatar svg {
      width: 40px;
      height: 40px;
      stroke: var(--primary-dark);
      stroke-width: 1.8;
    }

    .profile-hero h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .profile-hero p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .menu-group {
      padding: 0 20px;
    }

    .menu-card {
      background-color: white;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .menu-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      text-decoration: none;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      transition: background-color var(--transition-fast);
      cursor: pointer;
    }

    .menu-row:last-child {
      border-bottom: none;
    }

    .menu-row:active {
      background-color: #F9FAFB;
    }

    .menu-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-left svg {
      width: 20px;
      height: 20px;
      stroke: var(--text-light);
      stroke-width: 2;
      fill: none;
    }

    .menu-left span {
      font-size: 14px;
      font-weight: 600;
    }

    .menu-right svg {
      width: 16px;
      height: 16px;
      stroke: var(--text-light);
      stroke-width: 2.5;
    }

    /* Info Card Modal */
    .profile-info-modal {
      display: none;
      padding: 16px;
      background-color: #F9FAFB;
      border-radius: 12px;
      margin-top: 10px;
      font-size: 13px;
      border: 1px dashed var(--border-color);
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="app-container">
    <!-- Offline status banner -->
    <div class="sync-banner" id="sync-banner"></div>

    <!-- Header -->
    <header class="app-header">
      <h1>Profile</h1>
      <!-- <span class="badge badge-worker worker-role-placeholder">Worker</span> -->
    </header>

    <!-- Hero Profile card -->
    <section class="profile-hero">
      <div class="profile-hero-avatar">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
        </svg>
      </div>
      <h2 class="worker-name-placeholder">-</h2>
      <!-- <p class="worker-role-placeholder"
        style="text-transform: uppercase; font-weight: 700; color: var(--primary-dark); font-size: 11px; letter-spacing: 0.5px;">
        Worker</p> -->
    </section>

    <!-- Statistics overview -->
    <section class="stats-section" style="margin-top: -10px;">
      <div class="card" style="display: flex; justify-content: space-around; text-align: center; padding: 14px 10px;">
        <div>
          <div class="stat-value" id="stats-total" style="font-size: 24px;">0</div>
          <div class="stat-label"
            style="font-size: 11px; font-weight: 600; color: var(--text-light); text-transform: uppercase; margin-top: 2px;">
            Total Entries</div>
        </div>
        <div style="border-left: 1px solid var(--border-color);"></div>
        <div>
          <div class="stat-value" id="stats-today" style="font-size: 24px;">0</div>
          <div class="stat-label"
            style="font-size: 11px; font-weight: 600; color: var(--text-light); text-transform: uppercase; margin-top: 2px;">
            Added Today</div>
        </div>
      </div>
    </section>

    <!-- Action Menus -->
    <section class="menu-group">
      <div class="menu-card">
        <!-- My Profile Details Toggle -->
        <div class="menu-row" id="my-profile-row">
          <div class="menu-left">
            <svg viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span>My Account info</span>
          </div>
          <div class="menu-right">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </div>
        </div>
        <!-- Collapsible Info Panel -->
        <div class="profile-info-modal" id="account-info-panel">
          Name: <strong class="worker-name-placeholder">-</strong><br>
          EMPCODE: <strong id="info-username">-</strong><br>
          Phone Number: <strong id="info-phone">-</strong>
        </div>

        <!-- Calendar -->
        <div class="menu-row" id="my-calendar-row">
          <div class="menu-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>Calendar</span>
          </div>
          <div class="menu-right">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </div>
        </div>

        <!-- Install PWA trigger -->
        <div class="menu-row" id="install-app-row" style="display: none;">
          <div class="menu-left">
            <svg viewBox="0 0 24 24" style="stroke: var(--primary);">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 12.75l3 3m0 0l3-3m-3 3v-7.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span style="color: var(--primary);">Install Mobile App</span>
          </div>
          <div class="menu-right">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </div>
        </div>

        <!-- Log out button -->
        <div class="menu-row logout-action" style="color: var(--error);">
          <div class="menu-left">
            <svg viewBox="0 0 24 24" style="stroke: var(--error);">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
            </svg>
            <span>Sign Out</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Floating Translucent Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="/" class="bottom-nav-item" id="nav-home">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
        <span>Home</span>
      </a>
      <a href="/restaurants" class="bottom-nav-item" id="nav-restaurants">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
        </svg>
        <span>MSL List</span>
      </a>
      <a href="/add-restaurant" class="bottom-nav-item add-button-item">
        <div class="bottom-nav-add-btn">
          <svg viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
        </div>
      </a>
      <a href="/profile" class="bottom-nav-item active" id="nav-profile">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
        </svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <!-- Calendar Modal Overlay -->
  <div class="modal-overlay" id="worker-calendar-overlay">
    <div class="modal-card calendar-container" style="padding: 24px; max-width: 500px; width: 95%;">
      <button class="modal-close-btn" id="close-worker-calendar-btn" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <h3 class="calendar-title">Calendar</h3>
      
      <div class="card calendar-card">
        <div class="calendar-header">
          <button id="worker-prev-month" class="btn btn-secondary" style="width: auto; padding: 8px 12px;">&larr; Prev</button>
          <h4 id="worker-calendar-month-year" style="margin: 0; font-size: 16px; font-weight: 700; color: var(--text-main);">Month Year</h4>
          <button id="worker-next-month" class="btn btn-secondary" style="width: auto; padding: 8px 12px;">Next &rarr;</button>
        </div>
        
        <div class="calendar-grid-header">
          <div>Sun</div>
          <div>Mon</div>
          <div>Tue</div>
          <div>Wed</div>
          <div>Thu</div>
          <div>Fri</div>
          <div>Sat</div>
        </div>
        
        <div id="worker-calendar-days" class="calendar-grid-body">
          <!-- Days injected via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Calendar Day Modal Overlay -->
  <div class="modal-overlay" id="calendar-day-modal-overlay">
    <div class="modal-card" style="max-width: 600px; padding: 28px;">
      <button class="modal-close-btn" id="close-calendar-day-modal-btn" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <h3 style="font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 20px;"><span id="calendar-day-modal-date"></span></h3>

      <div class="table-responsive-wrapper" style="overflow-y: auto; max-height: 340px; border-radius: 12px; border: 1px solid var(--border-color);">
        <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 13px;">
          <thead style="position: sticky; top: 0; background-color: #F9FAFB; z-index: 1;">
            <tr>
              <th style="padding: 12px; border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 11px;">MSL Code</th>
              <th style="padding: 12px; border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 11px;">Name</th>
              <th style="padding: 12px; border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 11px;">City</th>
            </tr>
          </thead>
          <tbody id="calendar-day-table-body">
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/db-offline.js"></script>

  <script>
    // PWA Install prompt listener
    let deferredPrompt = null;
    let workerRestaurants = [];
    let currentCalendarDate = new Date();

    document.addEventListener('DOMContentLoaded', () => {
      loadProfileStats();

      // Hook account info collapsible panel
      const profileRow = document.getElementById('my-profile-row');
      const infoPanel = document.getElementById('account-info-panel');

      profileRow.addEventListener('click', () => {
        const isClosed = infoPanel.style.display === 'none' || !infoPanel.style.display;
        infoPanel.style.display = isClosed ? 'block' : 'none';
      });

      // Bind dynamic worker metadata
      const user = api.getUser();
      if (user) {
        document.getElementById('info-username').textContent = user.username;
        document.getElementById('info-phone').textContent = user.phoneNumber || 'Not Provided';
      }

      // Handle install app trigger
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent Chrome 67 and earlier from automatically showing the prompt
        e.preventDefault();
        // Stash the event so it can be triggered later.
        deferredPrompt = e;
        // Update UI notify the user they can install the PWA
        const installRow = document.getElementById('install-app-row');
        installRow.style.display = 'flex';

        installRow.addEventListener('click', () => {
          // Show the prompt
          deferredPrompt.prompt();
          // Wait for the user to respond to the prompt
          deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              console.log('User accepted the PWA install prompt');
            } else {
              console.log('User dismissed the PWA install prompt');
            }
            deferredPrompt = null;
            installRow.style.display = 'none';
          });
        });
      });

      window.addEventListener('sync-completed', () => {
        loadProfileStats();
      });

      // Calendar Event Listeners
      const calendarRow = document.getElementById('my-calendar-row');
      const calendarOverlay = document.getElementById('worker-calendar-overlay');
      const closeCalendarBtn = document.getElementById('close-worker-calendar-btn');

      if (calendarRow) {
        calendarRow.addEventListener('click', async () => {
          calendarOverlay.classList.add('active');
          if (workerRestaurants.length === 0) {
            try {
              workerRestaurants = await api.get('/restaurants?addedByMe=true');
              renderWorkerCalendar();
            } catch (err) {
              console.error('Failed to load my restaurants', err);
            }
          } else {
            renderWorkerCalendar();
          }
        });
      }

      if (closeCalendarBtn && calendarOverlay) {
        closeCalendarBtn.addEventListener('click', () => calendarOverlay.classList.remove('active'));
        calendarOverlay.addEventListener('click', (e) => {
          if (e.target === calendarOverlay) calendarOverlay.classList.remove('active');
        });
      }

      const prevMonthBtn = document.getElementById('worker-prev-month');
      const nextMonthBtn = document.getElementById('worker-next-month');
      if (prevMonthBtn && nextMonthBtn) {
        prevMonthBtn.addEventListener('click', () => {
          currentCalendarDate.setMonth(currentCalendarDate.getMonth() - 1);
          renderWorkerCalendar();
        });
        nextMonthBtn.addEventListener('click', () => {
          currentCalendarDate.setMonth(currentCalendarDate.getMonth() + 1);
          renderWorkerCalendar();
        });
      }

      // Bind Calendar Day Modal Close
      const calDayOverlay = document.getElementById('calendar-day-modal-overlay');
      const closeCalDayBtn = document.getElementById('close-calendar-day-modal-btn');
      if (closeCalDayBtn && calDayOverlay) {
        closeCalDayBtn.addEventListener('click', () => calDayOverlay.classList.remove('active'));
        calDayOverlay.addEventListener('click', (e) => {
          if (e.target === calDayOverlay) calDayOverlay.classList.remove('active');
        });
      }
    });

    async function loadProfileStats() {
      try {
        const stats = await api.get('/restaurants/stats/worker');
        if (stats) {
          document.getElementById('stats-total').textContent = stats.totalAdded;
          document.getElementById('stats-today').textContent = stats.addedToday;
        }
      } catch (err) {
        console.error('Profile Stats Load Error:', err);
      }
    }

    function renderWorkerCalendar() {
      const monthYearEl = document.getElementById('worker-calendar-month-year');
      const daysContainer = document.getElementById('worker-calendar-days');
      
      if (!monthYearEl || !daysContainer) return;
      
      const year = currentCalendarDate.getFullYear();
      const month = currentCalendarDate.getMonth();
      
      monthYearEl.textContent = new Date(year, month).toLocaleString('default', { month: 'long', year: 'numeric' });
      
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      
      let html = '';
      
      for (let i = 0; i < firstDay; i++) {
        const isWeekend = (i === 0 || i === 6);
        const weekendClass = isWeekend ? 'weekend' : '';
        html += `<div class="calendar-day-cell empty ${weekendClass}"></div>`;
      }
      
      const monthEntries = workerRestaurants.filter(r => {
        const d = new Date(r.createdAtUTC || r.createdAtIST);
        return d.getFullYear() === year && d.getMonth() === month;
      });
      
      const entriesByDay = {};
      monthEntries.forEach(r => {
        const d = new Date(r.createdAtUTC || r.createdAtIST).getDate();
        if (!entriesByDay[d]) entriesByDay[d] = [];
        entriesByDay[d].push(r);
      });
      
      const today = new Date();
      
      for (let day = 1; day <= daysInMonth; day++) {
        const isToday = today.getDate() === day && today.getMonth() === month && today.getFullYear() === year;
        const entries = entriesByDay[day] || [];
        const count = entries.length;
        
        const countBadge = count > 0 ? `<div class="calendar-badge">${count}</div>` : '';
        const todayClass = isToday ? 'today' : '';
        const todayNumClass = isToday ? 'today-num' : '';
        
        const currentDayOfWeek = new Date(year, month, day).getDay();
        const weekendClass = (currentDayOfWeek === 0 || currentDayOfWeek === 6) ? 'weekend' : '';
        
        const clickHandler = count > 0 ? `onclick="openWorkerCalendarDayModal(${year}, ${month}, ${day})"` : '';
        const cursorStyle = count > 0 ? 'cursor: pointer;' : '';
        
        html += `
          <div class="calendar-day-cell ${todayClass} ${weekendClass}" ${clickHandler} style="${cursorStyle}">
            <div class="calendar-day-num ${todayNumClass}">${day}</div>
            <div class="calendar-day-content">
              ${countBadge}
              ${count > 0 ? `<div class="calendar-day-label">entries</div>` : ''}
            </div>
          </div>
        `;
      }
      
      const totalCells = firstDay + daysInMonth;
      const remainingCells = (7 - (totalCells % 7)) % 7;
      
      for (let i = 0; i < remainingCells; i++) {
        const currentDayOfWeek = (totalCells + i) % 7;
        const weekendClass = (currentDayOfWeek === 0 || currentDayOfWeek === 6) ? 'weekend' : '';
        html += `<div class="calendar-day-cell empty ${weekendClass}"></div>`;
      }
      
      daysContainer.innerHTML = html;
    }

    function openWorkerCalendarDayModal(year, month, day) {
      const dayEntries = workerRestaurants.filter(r => {
        const d = new Date(r.createdAtUTC || r.createdAtIST);
        return d.getFullYear() === year && d.getMonth() === month && d.getDate() === day;
      });

      const modalOverlay = document.getElementById('calendar-day-modal-overlay');
      const tbody = document.getElementById('calendar-day-table-body');
      const dateTitle = document.getElementById('calendar-day-modal-date');

      dateTitle.textContent = new Date(year, month, day).toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

      if (dayEntries.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; padding: 20px; color: var(--text-light);">No entries found for this day.</td></tr>`;
      } else {
        tbody.innerHTML = dayEntries.map(item => `
          <tr class="clickable-worker-row" onclick="window.location.href='/restaurant-detail?id=${item._id}'" style="cursor: pointer; border-bottom: 1px solid var(--border-color);">
            <td style="padding: 12px;"><code style="background-color: #F1F5F9; padding: 4px 8px; border-radius: 6px; font-size:12px; font-weight:700; color:var(--primary-dark);">${item.mslCode || 'N/A'}</code></td>
            <td style="padding: 12px; color: var(--text-main);"><strong>${item.mslname}</strong></td>
            <td style="padding: 12px; color: var(--text-muted);">${item.city || 'N/A'}</td>
          </tr>
        `).join('');
      }

      modalOverlay.classList.add('active');
    }
  </script>
</body>

</html>
