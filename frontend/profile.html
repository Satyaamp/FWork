<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Profile - FieldForce</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    .profile-hero {
      text-align: center;
      padding: 30px 20px 20px 20px;
      background-color: white;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .profile-hero-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px auto;
      border: 3px solid white;
      box-shadow: var(--shadow-md);
    }

    .profile-hero-avatar svg {
      width: 40px;
      height: 40px;
      stroke: var(--primary-dark);
      stroke-width: 1.8;
    }

    .profile-hero h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .profile-hero p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .menu-group {
      padding: 0 20px;
    }

    .menu-card {
      background-color: white;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .menu-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      text-decoration: none;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      transition: background-color var(--transition-fast);
      cursor: pointer;
    }

    .menu-row:last-child {
      border-bottom: none;
    }

    .menu-row:active {
      background-color: #F9FAFB;
    }

    .menu-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-left svg {
      width: 20px;
      height: 20px;
      stroke: var(--text-light);
      stroke-width: 2;
      fill: none;
    }

    .menu-left span {
      font-size: 14px;
      font-weight: 600;
    }

    .menu-right svg {
      width: 16px;
      height: 16px;
      stroke: var(--text-light);
      stroke-width: 2.5;
    }

    /* Info Card Modal */
    .profile-info-modal {
      display: none;
      padding: 16px;
      background-color: #F9FAFB;
      border-radius: 12px;
      margin-top: 10px;
      font-size: 13px;
      border: 1px dashed var(--border-color);
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="app-container">
    <!-- Offline status banner -->
    <div class="sync-banner" id="sync-banner"></div>

    <!-- Header -->
    <header class="app-header">
      <h1>Profile</h1>
      <!-- <span class="badge badge-worker worker-role-placeholder">Worker</span> -->
    </header>

    <!-- Hero Profile card -->
    <section class="profile-hero">
      <div class="profile-hero-avatar">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
        </svg>
      </div>
      <h2 class="worker-name-placeholder">-</h2>
      <p class="worker-role-placeholder"
        style="text-transform: uppercase; font-weight: 700; color: var(--primary-dark); font-size: 11px; letter-spacing: 0.5px;">
        Worker</p>
    </section>

    <!-- Statistics overview -->
    <section class="stats-section" style="margin-top: -10px;">
      <div class="card" style="display: flex; justify-content: space-around; text-align: center; padding: 14px 10px;">
        <div>
          <div class="stat-value" id="stats-total" style="font-size: 24px;">0</div>
          <div class="stat-label"
            style="font-size: 11px; font-weight: 600; color: var(--text-light); text-transform: uppercase; margin-top: 2px;">
            Total Entries</div>
        </div>
        <div style="border-left: 1px solid var(--border-color);"></div>
        <div>
          <div class="stat-value" id="stats-today" style="font-size: 24px;">0</div>
          <div class="stat-label"
            style="font-size: 11px; font-weight: 600; color: var(--text-light); text-transform: uppercase; margin-top: 2px;">
            Added Today</div>
        </div>
      </div>
    </section>

    <!-- Action Menus -->
    <section class="menu-group">
      <div class="menu-card">
        <!-- My Profile Details Toggle -->
        <div class="menu-row" id="my-profile-row">
          <div class="menu-left">
            <svg viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span>My Account info</span>
          </div>
          <div class="menu-right">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </div>
        </div>
        <!-- Collapsible Info Panel -->
        <div class="profile-info-modal" id="account-info-panel">
          Name: <strong class="worker-name-placeholder">-</strong><br>
          EMPCODE: <strong id="info-username">-</strong><br>
          Phone Number: <strong id="info-phone">-</strong>
        </div>

        <!-- Filtered Restaurants list -->
        <a href="/restaurants?my=true" class="menu-row">
          <div class="menu-left">
            <svg viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
            </svg>
            <span>My Added Restaurants</span>
          </div>
          <div class="menu-right">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </div>
        </a>

        <!-- Install PWA trigger -->
        <div class="menu-row" id="install-app-row" style="display: none;">
          <div class="menu-left">
            <svg viewBox="0 0 24 24" style="stroke: var(--primary);">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 12.75l3 3m0 0l3-3m-3 3v-7.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span style="color: var(--primary);">Install Mobile App</span>
          </div>
          <div class="menu-right">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </div>
        </div>

        <!-- Log out button -->
        <div class="menu-row logout-action" style="color: var(--error);">
          <div class="menu-left">
            <svg viewBox="0 0 24 24" style="stroke: var(--error);">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
            </svg>
            <span>Sign Out</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Floating Translucent Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="/" class="bottom-nav-item" id="nav-home">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
        <span>Home</span>
      </a>
      <a href="/restaurants" class="bottom-nav-item" id="nav-restaurants">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
        </svg>
        <span>Restaurants</span>
      </a>
      <a href="/add-restaurant" class="bottom-nav-item add-button-item">
        <div class="bottom-nav-add-btn">
          <svg viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
        </div>
      </a>
      <a href="/profile" class="bottom-nav-item active" id="nav-profile">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
        </svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/db-offline.js"></script>

  <script>
    // PWA Install prompt listener
    let deferredPrompt = null;

    document.addEventListener('DOMContentLoaded', () => {
      loadProfileStats();

      // Hook account info collapsible panel
      const profileRow = document.getElementById('my-profile-row');
      const infoPanel = document.getElementById('account-info-panel');

      profileRow.addEventListener('click', () => {
        const isClosed = infoPanel.style.display === 'none' || !infoPanel.style.display;
        infoPanel.style.display = isClosed ? 'block' : 'none';
      });

      // Bind dynamic worker metadata
      const user = api.getUser();
      if (user) {
        document.getElementById('info-username').textContent = user.username;
        document.getElementById('info-phone').textContent = user.phoneNumber || 'Not Provided';
      }

      // Handle install app trigger
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent Chrome 67 and earlier from automatically showing the prompt
        e.preventDefault();
        // Stash the event so it can be triggered later.
        deferredPrompt = e;
        // Update UI notify the user they can install the PWA
        const installRow = document.getElementById('install-app-row');
        installRow.style.display = 'flex';

        installRow.addEventListener('click', () => {
          // Show the prompt
          deferredPrompt.prompt();
          // Wait for the user to respond to the prompt
          deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              console.log('User accepted the PWA install prompt');
            } else {
              console.log('User dismissed the PWA install prompt');
            }
            deferredPrompt = null;
            installRow.style.display = 'none';
          });
        });
      });

      window.addEventListener('sync-completed', () => {
        loadProfileStats();
      });
    });

    async function loadProfileStats() {
      try {
        const stats = await api.get('/restaurants/stats/worker');
        if (stats) {
          document.getElementById('stats-total').textContent = stats.totalAdded;
          document.getElementById('stats-today').textContent = stats.addedToday;
        }
      } catch (err) {
        console.error('Profile Stats Load Error:', err);
      }
    }
  </script>
</body>

</html>
